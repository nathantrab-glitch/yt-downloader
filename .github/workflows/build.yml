name: Construire l'application

on:
  push:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Decompresser le projet
        run: unzip -q ./*.zip -d projet

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - uses: android-actions/setup-android@v3

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.9"

      - name: Construire l'APK
        working-directory: projet/YtDownloader
        run: gradle assembleDebug --no-daemon

      - name: Nommer le fichier
        run: cp projet/YtDownloader/app/build/outputs/apk/debug/app-debug.apk YT-Downloader.apk

      - name: Publier
        uses: softprops/action-gh-release@v2
        with:
          tag_name: version-${{ github.run_number }}
          name: YT Downloader (version ${{ github.run_number }})
          files: YT-Downloader.apk
